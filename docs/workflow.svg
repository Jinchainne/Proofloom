<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330"><rect width="1200" height="330" rx="24" fill="#111"/><text x="56" y="58" fill="#c8f54b" font-family="monospace" font-size="13">PROOFLOOM / VERIFIABLE OUTCOMES</text><text x="56" y="96" fill="#f7f4eb" font-family="Arial" font-size="28" font-weight="700">From claim to consensus settlement</text><g font-family="Arial"><g transform="translate(55 145)"><rect width="190" height="105" rx="12" fill="#f7f4eb"/><text x="20" y="32" fill="#777" font-family="monospace" font-size="11">01 / WALLET</text><text x="20" y="64" fill="#111" font-size="18" font-weight="700">Create bounty</text><text x="20" y="86" fill="#666" font-size="12">Lock claim + evidence</text></g><g transform="translate(285 145)"><rect width="190" height="105" rx="12" fill="#c8f54b"/><text x="20" y="32" fill="#35430d" font-family="monospace" font-size="11">02 / CONTRACT</text><text x="20" y="64" fill="#111" font-size="18" font-weight="700">Freeze terms</text><text x="20" y="86" fill="#34400d" font-size="12">Store on Bradbury</text></g><g transform="translate(515 145)"><rect width="190" height="105" rx="12" fill="#f7f4eb"/><text x="20" y="32" fill="#777" font-family="monospace" font-size="11">03 / CONSENSUS</text><text x="20" y="64" fill="#111" font-size="18" font-weight="700">Fetch + judge</text><text x="20" y="86" fill="#666" font-size="12">Independent validators</text></g><g transform="translate(745 145)"><rect width="190" height="105" rx="12" fill="#f7f4eb"/><text x="20" y="32" fill="#777" font-family="monospace" font-size="11">04 / RESULT</text><text x="20" y="64" fill="#111" font-size="18" font-weight="700">Write verdict</text><text x="20" y="86" fill="#666" font-size="12">APPROVED or REJECTED</text></g><g transform="translate(975 145)"><rect width="170" height="105" rx="12" fill="#20251b" stroke="#c8f54b"/><text x="20" y="32" fill="#c8f54b" font-family="monospace" font-size="11">05 / LEDGER</text><text x="20" y="64" fil